    <style>
      /* Static shell painted before the bundle arrives; React replaces it. */
      .shell { position: fixed; inset: 0; background: #f2f5f6; color: #14232b; font: 16px/1.45 system-ui, sans-serif; }
      .shell__sheet { position: absolute; left: 0; right: 0; bottom: 60px; height: 34vh; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -2px 24px rgba(20,35,43,.14); padding: 26px 16px 0; }
      .shell__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: #fff; border-top: 1px solid #d7dee2; display: flex; }
      .shell__bar span { flex: 1; align-self: center; text-align: center; font-size: 12px; color: #55656e; }
      .shell__line { height: 14px; border-radius: 6px; background: #e6ecef; margin: 8px 0; }
      @media (prefers-color-scheme: dark) { .shell { background: #0f1a20; color: #e6ecef; } .shell__sheet, .shell__bar { background: #182630; border-color: #2b3b46; } .shell__line { background: #213139; } }
      @media (min-width: 900px) { .shell__sheet { top: 0; bottom: 0; left: 84px; width: 440px; height: auto; border-radius: 0; } .shell__bar { top: 0; width: 84px; height: auto; flex-direction: column; border-top: 0; border-right: 1px solid #d7dee2; } }
