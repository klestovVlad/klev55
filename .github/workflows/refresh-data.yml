name: Refresh live data
on:
  schedule:
    - cron: '20 2 * * *' # daily, 08:20 Omsk time
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:refresh
      - run: npm run qa
      - name: Commit refreshed data
        run: |
          git config user.name "klev55-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: daily refresh (hydro, observations)"
          git push
